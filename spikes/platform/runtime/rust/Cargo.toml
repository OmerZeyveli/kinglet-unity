[package]
name = "kinglet-host-probe"
version = "0.0.1"
edition = "2024"
rust-version = "1.97.1"

[[bin]]
name = "kinglet-host-probe"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
uuid = { version = "1.16.0", features = ["v4"] }
